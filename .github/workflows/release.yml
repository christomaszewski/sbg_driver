# Publish this driver to the public rig registry on every release.
#
# On a v* tag push or a published GitHub release, re-pins
# services/sbg-driver/manifest.yaml in christomaszewski/rig-registry-public to
# the released commit (full SHA — rig never accepts short/branch revs),
# regenerates index.json with rig's own indexer, and pushes. Idempotent: a
# duplicate trigger (tag push + release published for the same tag) finds the
# manifest already current and exits green without a commit.
#
# Auth: RIG_REGISTRY_TOKEN — a fine-grained PAT scoped to rig-registry-public
# only (Contents: read/write). On token expiry this job fails at the registry
# checkout; rotate with `gh secret set RIG_REGISTRY_TOKEN`.
name: release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Registry manifest version (X.Y.Z; not needed on tag/release events)'
        required: true

concurrency:
  group: registry-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: derive version + released commit
        run: |
          case "${{ github.event_name }}" in
            release) ver='${{ github.event.release.tag_name }}' ;;
            push)    ver="${GITHUB_REF_NAME}" ;;
            *)       ver='${{ inputs.version }}' ;;
          esac
          ver="${ver#v}"
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$ver' is not X.Y.Z"
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          # Annotated tags make github.sha the tag object, not the commit —
          # always peel to the commit the registry pin must reference.
          echo "rev=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: christomaszewski/rig-registry-public
          token: ${{ secrets.RIG_REGISTRY_TOKEN }}
          path: .registry

      - name: install rig (registry validator + indexer)
        run: pipx install git+https://github.com/christomaszewski/rig

      - name: pin sbg-driver ${{ steps.meta.outputs.version }} -> ${{ steps.meta.outputs.rev }}
        run: |
          mkdir -p .registry/services/sbg-driver
          cat > .registry/services/sbg-driver/manifest.yaml <<EOF
          kind: service
          name: sbg-driver
          version: ${{ steps.meta.outputs.version }}
          platforms: [linux/arm64]
          ros_distro: lyrical
          instantiable: true            # template service — a profile (or hand-authored config) instantiates it
          source:
            repo: https://github.com/christomaszewski/sbg_driver.git
            rev: ${{ steps.meta.outputs.rev }}
          EOF
          cd .registry && ./tools/gen-index   # validates first; an invalid registry is never indexed

      - name: commit + push registry
        run: |
          cd .registry
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/sbg-driver index.json
          if git diff --cached --quiet; then
            echo 'registry already current — nothing to publish'
            exit 0
          fi
          git commit -m "sbg-driver ${{ steps.meta.outputs.version }} -> ${{ steps.meta.outputs.rev }}"
          git push
