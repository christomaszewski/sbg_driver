name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ROS_DISTRO: lyrical
  COLCON_DEFAULTS: --event-handlers console_direct+

# Baseline token permissions for every job. The container jobs need
# packages:read to pull the GHCR CI image; the `image` job overrides with
# packages:write to push it.
permissions:
  contents: read
  packages: read

# Container jobs default to `sh` (dash), where `source` is undefined. The
# ROS setup scripts require bash, so make bash the default for all run steps.
defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Build the CI image and push to GHCR. All downstream jobs pull from this so
  # they share an identical toolchain.
  # ---------------------------------------------------------------------------
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sbg_driver-ci
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            # format=long => full 40-char SHA, matching the `sha-${{ github.sha }}`
            # the container jobs pull (default short SHA caused manifest-unknown).
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.ci
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          load: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ROS_DISTRO=${{ env.ROS_DISTRO }}

  # ---------------------------------------------------------------------------
  # Build + test all packages inside the CI image.
  # ---------------------------------------------------------------------------
  build-test:
    needs: image
    # Pulls the sha-tagged CI image, which fork PRs cannot push (no package
    # perms) — skip there instead of failing at the container pull.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/sbg_driver-ci:sha-${{ github.sha }}
      options: --user root
      # The CI image is a private GHCR package on first publish; authenticate
      # the implicit container pull with the same-repo GITHUB_TOKEN.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: rosdep install (skip-keys covers in-workspace deps)
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          rosdep update --rosdistro=${ROS_DISTRO} || true
          rosdep install --from-paths src --ignore-src -r -y \
            --skip-keys "sbg_driver sbg_driver_core sbg_msgs" || true

      - name: colcon build
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          colcon build --base-paths src ${COLCON_DEFAULTS} \
            --cmake-args -DCMAKE_BUILD_TYPE=Release \
                          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: colcon test (functional; style gated separately in lint job)
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          # Exclude ament_lint_auto style tests (label "linter") here. Of those,
          # only clang-format is gated (the dedicated lint job); the residual
          # cpplint/uncrustify disagreements are known, non-gating, and tracked
          # as Phase 3j cleanup. This job gates on the functional gtest +
          # launch_testing suites.
          colcon test --base-paths src ${COLCON_DEFAULTS} \
            --return-code-on-test-failure --ctest-args -LE linter
          colcon test-result --verbose

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: log/

  # ---------------------------------------------------------------------------
  # Lint pass: clang-format check, ament_lint_auto suite.
  # ---------------------------------------------------------------------------
  lint:
    needs: image
    # Pulls the sha-tagged CI image, which fork PRs cannot push (no package
    # perms) — skip there instead of failing at the container pull.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/sbg_driver-ci:sha-${{ github.sha }}
      options: --user root
      # The CI image is a private GHCR package on first publish; authenticate
      # the implicit container pull with the same-repo GITHUB_TOKEN.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: clang-format
        run: |
          find src -type f \( -name '*.hpp' -o -name '*.cpp' -o -name '*.h' -o -name '*.cc' \) \
            -not -path '*/build/*' -not -path '*/install/*' \
            -print0 | xargs -0 -r clang-format --dry-run -Werror --style=file

  # ---------------------------------------------------------------------------
  # AddressSanitizer + UndefinedBehaviorSanitizer.
  # ---------------------------------------------------------------------------
  asan:
    needs: image
    # Pulls the sha-tagged CI image, which fork PRs cannot push (no package
    # perms) — skip there instead of failing at the container pull.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/sbg_driver-ci:sha-${{ github.sha }}
      options: --user root
      # The CI image is a private GHCR package on first publish; authenticate
      # the implicit container pull with the same-repo GITHUB_TOKEN.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: colcon build (ASan/UBSan)
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          colcon build --base-paths src ${COLCON_DEFAULTS} \
            --cmake-args -DCMAKE_BUILD_TYPE=Debug \
                          -DSBG_ENABLE_ASAN=ON

      - name: colcon test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=0:print_stacktrace=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          colcon test --base-paths src ${COLCON_DEFAULTS} \
            --return-code-on-test-failure --ctest-args -LE linter
          colcon test-result --verbose

  # ---------------------------------------------------------------------------
  # ThreadSanitizer, scoped to sbg_driver_core. Justified by the std::jthread
  # I/O loop (Device::run / poll_once) and the run_active atomic_flag — the
  # core's device_smoke suite exercises start/stop of that thread.
  #
  # Scoped to the core ON PURPOSE: a TSan-instrumented full ROS 2 node SIGILLs
  # on startup because it dlopen's the uninstrumented rmw/DDS plugins (a known
  # TSan + rclcpp limitation, not a bug here). The pure-C++ core has no such
  # dependency and runs cleanly. halt_on_error=1 fails the job on any race.
  # ---------------------------------------------------------------------------
  tsan:
    needs: image
    # Pulls the sha-tagged CI image, which fork PRs cannot push (no package
    # perms) — skip there instead of failing at the container pull.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/sbg_driver-ci:sha-${{ github.sha }}
      options: --user root
      # The CI image is a private GHCR package on first publish; authenticate
      # the implicit container pull with the same-repo GITHUB_TOKEN.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: colcon build (TSan, core only)
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          colcon build --base-paths src --packages-select sbg_driver_core ${COLCON_DEFAULTS} \
            --cmake-args -DCMAKE_BUILD_TYPE=Debug \
                          -DSBG_ENABLE_TSAN=ON

      - name: colcon test
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          colcon test --base-paths src --packages-select sbg_driver_core ${COLCON_DEFAULTS} \
            --return-code-on-test-failure --ctest-args -LE linter
          colcon test-result --verbose

  # --- rig launcher contract, executable (see rigging.yaml) -------------------
  # `rig certify` runs `sbg-up <config> config` under a poisoned fleet env and asserts
  # the contract held: COMPOSE_PROJECT_NAME honored (no -p), images pulled from RIG_IMAGE_REGISTRY
  # as :RIG_IMAGE_TAG (build/pull agreement), fleet ROS env passed through, deterministic and
  # name-derived output. Bare runner — needs docker compose + PyYAML, not ROS.
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: christomaszewski/rig
          path: .rig
      - run: python3 -m pip install --user pyyaml
      - name: rig certify (launcher contract)
        run: ./.rig/rig certify --repo . --config sensors/sbg.example.yaml

  # --- rig build contract, executable (see rigging.yaml build:) ---------------
  # build_image.sh must forward the rig build env into the docker argv: a stub
  # `docker` on PATH records what it would have run, and we assert on it.
  # RIG_BUILD_NO_CACHE=1 => --no-cache --pull (absent without it); ROS_DISTRO and
  # RIG_BASE_IMAGE land as build-args, with standalone fallbacks when unset.
  build-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build_image.sh forwards the rig build env
        run: |
          mkdir -p "${RUNNER_TEMP}/stub"
          printf '#!/usr/bin/env bash\necho "docker $*" >> "${DOCKER_ARGV_LOG}"\n' \
            > "${RUNNER_TEMP}/stub/docker"
          chmod +x "${RUNNER_TEMP}/stub/docker"
          export PATH="${RUNNER_TEMP}/stub:${PATH}"
          export DOCKER_ARGV_LOG="${RUNNER_TEMP}/argv.log"

          # Bare invocation (no rig env beyond the workflow's ROS_DISTRO=lyrical,
          # which matches the standalone default): no cache-busting flags, and the
          # build-args fall back to the standalone ros-core parent.
          : > "${DOCKER_ARGV_LOG}"
          env -u RIG_BUILD_NO_CACHE -u RIG_BASE_IMAGE \
            tools/build_image.sh reg.example:5000 vtest
          grep -q -- '--build-arg ROS_DISTRO=lyrical' "${DOCKER_ARGV_LOG}"
          grep -q -- '--build-arg BASE_IMAGE=ros:lyrical-ros-core' "${DOCKER_ARGV_LOG}"
          ! grep -q -- '--no-cache' "${DOCKER_ARGV_LOG}"
          ! grep -q -- '--pull' "${DOCKER_ARGV_LOG}"

          # Full rig env: deliberate rebuild re-pulls the parent, and the
          # deployment's distro + base image are forwarded verbatim.
          : > "${DOCKER_ARGV_LOG}"
          RIG_BUILD_NO_CACHE=1 ROS_DISTRO=zephyrous \
            RIG_BASE_IMAGE=reg.example:5000/fleet-ros:v9 \
            tools/build_image.sh reg.example:5000 vtest
          grep -q -- '--no-cache --pull' "${DOCKER_ARGV_LOG}"
          grep -q -- '--build-arg ROS_DISTRO=zephyrous' "${DOCKER_ARGV_LOG}"
          grep -q -- '--build-arg BASE_IMAGE=reg.example:5000/fleet-ros:v9' "${DOCKER_ARGV_LOG}"

  # --- shell hygiene on the deploy surface ------------------------------------
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck launcher + build script + entrypoints
        run: shellcheck sbg-up tools/build_image.sh docker/entrypoints/*.sh
