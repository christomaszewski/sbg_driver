# Example rig sensor config for the sbg driver. Copy + rename per instance (e.g.
# sensors/sbg_front.yaml), edit for your vehicle, then:
#   ./sbg-up sensors/sbg_front.yaml up -d
# This is also the config CI's `rig certify` job runs against (the launcher-contract gate).
#
# `connection` is the generic, rig-uniform block; tools/render_params.py maps it onto the driver's
# `transport:` param. `driver_params` is copied VERBATIM into the node's ros__parameters (any key
# from the driver's params schema) — do NOT put `transport` there; it is derived from `connection`.

service: sbg
name: front                   # instance id -> ROS namespace /front; compose project sbg_front (standalone);
                              # also the fleet health instance (health.instance), whatever the namespace

connection:
  type: serial                # serial | udp | file
  serial:
    # Stable device path on the vehicle. Find it with:  ls -l /dev/serial/by-id/
    by_id: /dev/serial/by-id/usb-YOUR_DEVICE_HERE-if00
    baud: 921600
  # file:
  #   path: ../captures/run.bin # relative to this config; mounted read-only
  #   real_time_pace: true
  # udp:
  #   remote_ip: 192.168.1.20
  #   in_port: 5678
  #   out_port: 1234

ros:
  namespace: front            # -> /front/<topic>...

# Fleet health on /diagnostics (src/sbg_driver/doc/health.md). Optional: every key below is shown at
# its default, and the block can be omitted. Identity is not set here — the instance is `name`
# above, the vehicle is the VEHICLE_ID environment variable (rig exports it; set it yourself for a
# standalone `sbg-up`, or the statuses carry no vehicle).
health:
  interval_s: 1               # heartbeat period, s. Every publication is the complete inventory.
  stale_after_s: 5            # how long a device observation stays valid, s (>= 2 x interval_s).
                              # Cover a few periods of the slowest health log; STATUS is usually 1 Hz.
  stream_timeout_s: 2         # silence on the whole log stream, while active, that is an ERROR, s
  required_gnss_fix: fix      # none | fix | rtk_float | rtk_fixed — the gnss component always
                              # reports the actual grade and is a WARN below this one
  ignored_alerts: []          # device status flags never to raise, for products that lack them:
                              # MAIN_POWER IMU_POWER GPS_POWER SETTINGS TEMPERATURE DATALOGGER CPU
                              # Empty is omitted from rendered ROS YAML, using the typed default.
  limits: {}                  # producer-side limits; none by default. The one measured metric:
  #   temp.imu_c: {warn_above: 70, error_above: 85, error_below: -40}   # deg C; any subset of
  #                           # warn_above / warn_below / error_above / error_below
# There is no poll interval: the driver polls nothing, the device pushes every log it reports on.
# No supply voltage/current/power is reported either — sbgECom does not expose them.

driver_params: {}             # verbatim ros__parameters overrides; see src/sbg_driver/params/
# Example overrides (replace the `{}` above when enabling):
# driver_params:
#   frames:                  # override namespaced defaults to match your vehicle URDF
#     imu: sbg_imu_link
#     gps: sbg_gps_link
#     base: base_link
#     odom: odom
#   tf:
#     broadcast_odom_to_base: false  # opt in only if this node owns odom -> base
#   convention:
#     use_enu: true           # REP-103 ENU for nav2 / robot_localization
#   imu:
#     mag_scale: 5.0e-5      # Tesla per normalized unit; calibrate for the local field.
#                            # Default 0 disables imu/mag rather than publishing raw units.
#   time:
#     source: device_utc      # stamp outputs from INS UTC instead of host receive time —
#                             # the right choice when the rig's host + other sensors sync
#                             # their clocks to the SBG's NTP/PTP server. Requires the
#                             # UTC_TIME log to be enabled on the device.
#   outputs:
#     gnss_heading_offset_deg: 0.0   # yaw from the GNSS antenna baseline to the vehicle X axis,
#                             # applied to /gps/heading (90 = secondary antenna on the left)
#   configure_device:         # provision output rates etc. from params at activation.
#     enable: true            # ELLIPSE-only: the driver identifies the product at
#                             # activation and skips provisioning (with a warning) on
#                             # High Performance INS units (QUANTA/EKINOX/APOGEE) —
#                             # configure those via the device web UI / sbgInsRestApi.
