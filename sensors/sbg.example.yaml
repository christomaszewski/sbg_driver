# Example rig sensor config for the sbg driver. Copy + rename per instance (e.g.
# sensors/sbg_front.yaml), edit for your vehicle, then:
#   ./sbg-up sensors/sbg_front.yaml up -d
# This is also the config CI's `rig certify` job runs against (the launcher-contract gate).
#
# `connection` is the generic, rig-uniform block; tools/render_params.py maps it onto the driver's
# `transport:` param. `driver_params` is copied VERBATIM into the node's ros__parameters (any key
# from the driver's params schema) — do NOT put `transport` there; it is derived from `connection`.

service: sbg
name: front                   # instance id -> ROS namespace /front; compose project sbg_front (standalone)

connection:
  type: serial                # serial | udp | file
  serial:
    # Stable device path on the vehicle. Find it with:  ls -l /dev/serial/by-id/
    by_id: /dev/serial/by-id/usb-YOUR_DEVICE_HERE-if00
    baud: 921600
  # udp:
  #   remote_ip: 192.168.1.20
  #   in_port: 5678
  #   out_port: 1234

ros:
  namespace: front            # -> /front/<topic>...

driver_params: {}             # verbatim ros__parameters overrides; see src/sbg_driver/params/
# Example overrides (replace the `{}` above when enabling):
# driver_params:
#   convention:
#     use_enu: true           # REP-103 ENU for nav2 / robot_localization
#   time:
#     source: device_utc      # stamp outputs from INS UTC instead of host receive time —
#                             # the right choice when the rig's host + other sensors sync
#                             # their clocks to the SBG's NTP/PTP server. Requires the
#                             # UTC_TIME log to be enabled on the device.
#   configure_device:         # provision output rates etc. from params at activation.
#     enable: true            # ELLIPSE-only: the driver identifies the product at
#                             # activation and skips provisioning (with a warning) on
#                             # High Performance INS units (QUANTA/EKINOX/APOGEE) —
#                             # configure those via the device web UI / sbgInsRestApi.
