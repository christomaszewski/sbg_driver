# Deployment-grade compose for ONE sbg instance — parameterized + launched by
# `sbg-up` (which renders the params file and exports the env vars below). Run it via
# the launcher, not directly.
#
# Multi-instance safe: NO container_name; identity comes from the compose project (<service>_<name>)
# and the ROS namespace, so several sensors of the same kind never collide. Health comes from the
# runtime image's baked HEALTHCHECK (/diagnostics).
services:
  driver:
    # Image precedence (Docker Compose interpolation): SBG_IMAGE (a full per-service
    # override, e.g. a local sbg_driver:runtime) wins; else RIG_IMAGE_REGISTRY — injected by
    # rig from the vehicle's fleet policy — is prefixed onto sbg_driver:latest; else the bare
    # local sbg_driver:latest (the default dev/standalone behavior).
    image: ${SBG_IMAGE:-${RIG_IMAGE_REGISTRY:+${RIG_IMAGE_REGISTRY}/}sbg_driver:latest}
    network_mode: host          # reach the device + expose ROS 2 topics on the host
    ipc: host                   # shared-memory transport (Fast DDS) with other host nodes
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      # the single rendered params file, read-only (a single-file mount; not nested in any :ro dir)
      - ${SBG_PARAMS_HOST}:/etc/sbg_driver/params.yaml:ro
    command:
      - ros2
      - launch
      - sbg_driver
      - bringup.launch.py
      - params_file:=/etc/sbg_driver/params.yaml
      - namespace:=${SBG_NAMESPACE}
