# Hardware-in-the-loop against the real device. Uses host networking so the driver
# can reach the device by IP (and expose its topics on the host).
#
#   # build the runtime image first:
#   docker build -f docker/Dockerfile.runtime -t sbg_driver:runtime .
#   docker compose -f docker/compose/compose.hil.yaml up driver
#   # or override the image:
#   SBG_IMAGE=ghcr.io/<owner>/sbg_driver:latest docker compose ... up
name: sbg_driver_hil   # per-driver compose project (bare `docker compose -f`; see compose.dev.yaml)
services:
  driver:
    image: ${SBG_IMAGE:-sbg_driver:runtime}
    container_name: sbg_driver_hil
    network_mode: host          # reach the device by IP; expose ROS 2 topics on the host
    ipc: host                   # shared-memory transport (Fast DDS) with other host nodes
    restart: unless-stopped
    # --- serial operation / provisioning (optional) ---
    # Uncomment to pass a USB-serial adapter through (for transport.type: serial or
    # first-boot provisioning). Needs docker/udev/99-sbg.rules on the host.
    # devices:
    #   - /dev/sbg:/dev/sbg
    # group_add:
    #   - dialout
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    volumes:
      - ./hil_params:/etc/sbg_driver:ro
    command:
      - ros2
      - launch
      - sbg_driver
      - bringup.launch.py
      - params_file:=/etc/sbg_driver/hil.yaml

  # Optional live monitor: prints diagnostics. Start with
  #   docker compose -f docker/compose/compose.hil.yaml up driver monitor
  monitor:
    image: ${SBG_IMAGE:-sbg_driver:runtime}
    container_name: sbg_driver_monitor
    depends_on: [driver]
    network_mode: host
    ipc: host
    profiles: [monitor]         # only starts when explicitly requested
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    command:
      - bash
      - -lc
      - ros2 topic echo --once /diagnostics   # TODO: add `ros2 topic hz /<your_primary_topic>`
