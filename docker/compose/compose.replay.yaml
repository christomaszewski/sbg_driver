# Replay a captured byte log through the driver and visualize in rviz2.
# Point SBG_REPLAY_BAG at your capture (a repo-relative path, seen
# under /workspace in-container):
#   SBG_REPLAY_BAG=path/to/capture.bin docker compose -f docker/compose/compose.replay.yaml up
name: sbg_driver_replay   # per-driver compose project (bare `docker compose -f`; see compose.dev.yaml)
services:
  driver:
    image: sbg_driver:dev
    container_name: sbg_driver_replay
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    volumes:
      - ../../:/workspace:cached
    working_dir: /workspace
    command:
      - bash
      - -lc
      - >
        colcon build --base-paths src &&
        source install/setup.bash &&
        ros2 launch sbg_driver replay.launch.py
        bag:=/workspace/${SBG_REPLAY_BAG:?export SBG_REPLAY_BAG=<repo-relative .bin>}

  rviz:
    image: sbg_driver:dev
    container_name: sbg_driver_rviz
    depends_on: [driver]
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../../:/workspace:cached
    working_dir: /workspace
    command:
      - bash
      - -lc
      - source install/setup.bash && rviz2
