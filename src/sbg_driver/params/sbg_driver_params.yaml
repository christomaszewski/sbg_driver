sbg_driver:
  transport:
    # The device is opened once in on_activate, so transport settings cannot
    # take effect mid-run. Marked read_only: set-at-launch-only (a runtime set
    # is rejected rather than silently no-op'ing).
    type:
      type: string
      default_value: "file"
      description: "Transport: 'serial', 'udp', or 'file' (replay)"
      read_only: true
      validation:
        one_of<>: [["serial", "udp", "file"]]
    file:
      path:
        type: string
        default_value: ""
        description: "Path to .bin replay file (used when transport.type=file)"
        read_only: true
      real_time_pace:
        type: bool
        default_value: true
        description: "Pace replay to original recording rate"
        read_only: true
    serial:
      port:
        type: string
        default_value: "/dev/ttyUSB0"
        description: "Serial device path (Linux) or COM name (Windows)"
        read_only: true
      baud:
        type: int
        default_value: 921600
        description: "Serial baud rate"
        read_only: true
        validation:
          one_of<>: [[9600, 19200, 38400, 57600, 115200, 230400, 460800, 921600]]
    udp:
      remote_ip:
        type: string
        default_value: "192.168.1.20"
        description: "Remote device IP address"
        read_only: true
      in_port:
        type: int
        default_value: 1234
        description: "Local UDP listen port"
        read_only: true
        validation:
          bounds<>: [1, 65535]
      out_port:
        type: int
        default_value: 5678
        description: "Remote UDP port"
        read_only: true
        validation:
          bounds<>: [1, 65535]

  frames:
    imu:
      type: string
      default_value: "imu_link"
      description: "TF frame ID for IMU + magnetometer + barometer outputs"
    gps:
      type: string
      default_value: "gps_link"
      description: "TF frame ID for GNSS outputs (NavSatFix, gps velocity, etc.)"
    time_reference:
      type: string
      default_value: ""
      description: "frame_id for sensor_msgs/TimeReference (empty = global time)"
    base:
      type: string
      default_value: "base_link"
      description: "TF frame ID of the vehicle base"
    odom:
      type: string
      default_value: "odom"
      description: "TF frame ID of the odom frame"

  imu:
    sensor_model:
      type: string
      default_value: "custom"
      description: >-
        Sensor tier used to look up approximate accel/gyro noise defaults for
        the /imu/data covariance. 'custom' uses the explicit *_noise_stddev
        params below (or leaves covariance unknown if those are <0). Per-model
        defaults are rough datasheet-derived starting points - refine for your
        unit.
      validation:
        one_of<>: [["custom", "ellipse", "pulse", "ekinox", "apogee", "quanta"]]
    accel_noise_stddev:
      type: double
      default_value: -1.0
      description: >-
        Per-axis accelerometer 1σ noise in m/s². Overrides the sensor_model
        default when >= 0. Covariance diagonal = stddev². <0 => unknown.
    gyro_noise_stddev:
      type: double
      default_value: -1.0
      description: >-
        Per-axis gyroscope 1σ noise in rad/s. Overrides the sensor_model
        default when >= 0. Covariance diagonal = stddev². <0 => unknown.
    mag_scale:
      type: double
      default_value: 1.0
      description: >-
        Scale applied to the SBG magnetometer values before publishing.
        SBG outputs arbitrary units (~1.0 = local Earth field), NOT the Tesla
        that sensor_msgs/MagneticField specifies; the default 1.0 publishes
        the raw a.u. values (matches the upstream SBG driver). Set to the
        approximate local field magnitude in Tesla (e.g. 5.0e-5) to publish
        physical units.
      validation:
        gt<>: [0.0]

  convention:
    use_enu:
      type: bool
      default_value: false
      description: >-
        Convert sensor-native NED outputs to ENU per REP-103. Most ROS nav
        stacks (nav2, robot_localization) assume ENU and will produce wrong
        results with NED data. Default false (sensor-native); flip to true
        for typical ROS pipelines.

  topics:
    imu_data:
      type: string
      default_value: "imu/data"
      description: "sensor_msgs/Imu output topic"
    imu_temperature:
      type: string
      default_value: "imu/temperature"
      description: "sensor_msgs/Temperature from IMU board temp"
    mag:
      type: string
      default_value: "imu/mag"
      description: "sensor_msgs/MagneticField output topic"
    nav_sat_fix:
      type: string
      default_value: "gps/fix"
      description: "sensor_msgs/NavSatFix output topic"
    time_reference:
      type: string
      default_value: "time_reference"
      description: "sensor_msgs/TimeReference output topic (sensor UTC clock)"
    odom:
      type: string
      default_value: "odom"
      description: "nav_msgs/Odometry output topic (composed from EKF Nav+Quat+VelBody)"
    ekf_nav_sat_fix:
      type: string
      default_value: "ekf/fix"
      description: >-
        sensor_msgs/NavSatFix output topic for the FUSED INS geodetic position
        from EkfNav. Only created when outputs.publish_ekf_nav_sat_fix is true.
        Distinct from `nav_sat_fix`, which carries the raw GNSS receiver fix.
    nmea:
      type: string
      default_value: "nmea"
      description: >-
        nmea_msgs/Sentence ($GPGGA) output topic. Only created when
        outputs.publish_nmea_gga is true. Pair with a third-party NTRIP client
        (e.g. remap to its nmea input) to upload position to a VRS caster.
    sbg_status:
      type: string
      default_value: "sbg/status"
      description: "sbg_msgs/Status output topic - device general/com/aiding bitmasks"
    sbg_ekf_status:
      type: string
      default_value: "sbg/ekf_status"
      description: "sbg_msgs/EkfStatus output topic - INS solution mode + aiding bits"
    sbg_air_data_status:
      type: string
      default_value: "sbg/air_data_status"
      description: "sbg_msgs/AirDataStatus - validity bits from the air-data sensor"
    sbg_event:
      type: string
      default_value: "sbg/event"
      description: "sbg_msgs/Event - GPIO sync-in events (A through E)"
    sbg_gps_raw:
      type: string
      default_value: "sbg/gps_raw"
      description: "sbg_msgs/GpsRaw - raw GNSS observable blob for PPP/RTK post-processing"
    sbg_mag_calib:
      type: string
      default_value: "sbg/mag_calib"
      description: "sbg_msgs/MagCalib - mag-calibration snapshot used by /sbg/*_mag_calibration"
    sbg_ship_motion:
      type: string
      default_value: "sbg/ship_motion"
      description: "sbg_msgs/ShipMotion - marine surge/sway/heave motion"

  outputs:
    publish_ekf_nav_sat_fix:
      type: bool
      default_value: false
      description: >-
        Publish a second sensor_msgs/NavSatFix (topic topics.ekf_nav_sat_fix,
        default ekf/fix) carrying the FUSED INS geodetic position from EkfNav.
        Off by default: /gps/fix already carries the raw GNSS fix and /odom the
        fused solution in a local Cartesian frame. Enable when a consumer needs
        the fused GLOBAL lat/lon - smoother than raw GNSS and available through
        brief GNSS dropouts via dead-reckoning. Note NavSatStatus is coarse for
        the fused solution (position-valid → STATUS_FIX, else STATUS_NO_FIX).
    publish_nmea_gga:
      type: bool
      default_value: false
      description: >-
        Publish NMEA GGA (nmea_msgs/Sentence on topics.nmea, default nmea) at
        ~1 Hz from the GNSS position. Off by default. Enable to pair with a
        third-party NTRIP client that needs the rover position (GGA) to request
        corrections from a VRS / network-RTK caster. Only emitted for a computed
        fix; UTC time-of-day is receive-time (sufficient for VRS).

  # TF policy. Only odom->base is implemented: map->odom belongs to a
  # localization node (robot_localization/nav2), and base->imu mount geometry
  # belongs in the URDF. Params for those were declared-but-dead and have been
  # removed until something real consumes them.
  tf:
    broadcast_odom_to_base:
      type: bool
      default_value: true
      description: >-
        Broadcast TF: frames.odom -> frames.base derived from each Odometry
        emission. Disable if a downstream node (e.g. robot_localization)
        provides the transform.

  configure_device:
    enable:
      type: bool
      default_value: false
      description: >-
        Master switch. When true, apply the configure_device.* settings to the
        device during on_activate (after open, before streaming). Each section
        below has its own `apply` flag, so you set only what you intend. Settings
        are written to device RAM and take effect immediately for this session;
        they are NOT persisted to non-volatile memory here. To persist, call the
        /sbg/save_settings service afterwards (that reboots the device).
    motion_profile:
      apply:
        type: bool
        default_value: false
        description: "Apply motion_profile.value when configure_device.enable is true."
      value:
        type: string
        default_value: "general_purpose"
        description: "EKF motion-dynamics model for the platform."
        validation:
          one_of<>: [["general_purpose", "automotive", "marine", "airplane", "helicopter", "pedestrian", "uav_rotary_wing", "heavy_machinery", "static", "truck", "railway", "off_road_vehicle", "underwater"]]
    aiding:
      apply:
        type: bool
        default_value: false
        description: "Apply the aiding-input port assignments below."
      gps1_port:
        type: string
        default_value: "internal"
        description: "Port the primary GNSS module is connected on."
        validation:
          one_of<>: [["port_a", "port_b", "port_c", "port_d", "port_e", "internal", "disabled"]]
      rtcm_port:
        type: string
        default_value: "disabled"
        description: "Port RTCM corrections arrive on (serial-fed DGPS/RTK)."
        validation:
          one_of<>: [["port_a", "port_b", "port_c", "port_d", "port_e", "internal", "disabled"]]
      dvl_port:
        type: string
        default_value: "disabled"
        description: "Port a DVL is connected on."
        validation:
          one_of<>: [["port_a", "port_b", "port_c", "port_d", "port_e", "internal", "disabled"]]
      air_data_port:
        type: string
        default_value: "disabled"
        description: "Port air-data aiding is connected on."
        validation:
          one_of<>: [["port_a", "port_b", "port_c", "port_d", "port_e", "internal", "disabled"]]
    imu_alignment:
      apply:
        type: bool
        default_value: false
        description: "Apply the IMU axis alignment + lever arm below."
      axis_x:
        type: string
        default_value: "forward"
        description: "Vehicle direction the IMU X axis points along."
        validation:
          one_of<>: [["forward", "backward", "left", "right", "up", "down"]]
      axis_y:
        type: string
        default_value: "right"
        description: "Vehicle direction the IMU Y axis points along."
        validation:
          one_of<>: [["forward", "backward", "left", "right", "up", "down"]]
      mis_roll_deg:
        type: double
        default_value: 0.0
        description: "Fine roll misalignment, degrees (converted to rad on apply)."
      mis_pitch_deg:
        type: double
        default_value: 0.0
        description: "Fine pitch misalignment, degrees."
      mis_yaw_deg:
        type: double
        default_value: 0.0
        description: "Fine yaw misalignment, degrees."
      lever_arm:
        type: double_array
        default_value: [0.0, 0.0, 0.0]
        description: "IMU-to-vehicle-reference lever arm [x, y, z], metres (IMU axes)."
        validation:
          fixed_size<>: [3]
    gnss:
      apply:
        type: bool
        default_value: false
        description: "Apply the GNSS antenna lever arms + dual-antenna mode."
      lever_arm_primary:
        type: double_array
        default_value: [0.0, 0.0, 0.0]
        description: "Primary GNSS antenna lever arm [x, y, z], metres (IMU axes)."
        validation:
          fixed_size<>: [3]
      lever_arm_secondary:
        type: double_array
        default_value: [0.0, 0.0, 0.0]
        description: "Secondary (dual) GNSS antenna lever arm [x, y, z], metres."
        validation:
          fixed_size<>: [3]
      secondary_mode:
        type: string
        default_value: "single"
        description: "Dual-antenna mode. 'single' means no secondary antenna."
        validation:
          one_of<>: [["single", "dual_auto", "dual_rough", "dual_precise"]]
    mag_model:
      apply:
        type: bool
        default_value: false
        description: "Apply mag_model.value."
      value:
        type: string
        default_value: "internal_normal"
        description: "Magnetometer model."
        validation:
          one_of<>: [["internal_normal", "external_ecom"]]
    output:
      apply:
        type: bool
        default_value: false
        description: "Apply the per-log device-side output rates below."
      port:
        type: string
        default_value: "main"
        description: "Device output port these rates apply to (usually the main link)."
        validation:
          one_of<>: [["main", "port_c", "port_e"]]
      imu:
        type: string
        default_value: "unchanged"
        description: >-
          IMU_DATA output rate. 'unchanged' leaves the device's current setting;
          'disabled' turns it off; div_N divides the 200 Hz loop (div_8=25 Hz).
        validation:
          one_of<>: [["unchanged", "disabled", "main_loop", "div_2", "div_4", "div_5", "div_8", "div_10", "div_20", "div_40", "div_100", "div_200", "new_data", "pps"]]
      ekf_quat:
        type: string
        default_value: "unchanged"
        description: "EKF_QUAT output rate (orientation for /imu/data + /odom)."
        validation:
          one_of<>: [["unchanged", "disabled", "main_loop", "div_2", "div_4", "div_5", "div_8", "div_10", "div_20", "div_40", "div_100", "div_200", "new_data", "pps"]]
      ekf_nav:
        type: string
        default_value: "unchanged"
        description: "EKF_NAV output rate (fused position for /odom, /ekf/fix)."
        validation:
          one_of<>: [["unchanged", "disabled", "main_loop", "div_2", "div_4", "div_5", "div_8", "div_10", "div_20", "div_40", "div_100", "div_200", "new_data", "pps"]]
      ekf_vel_body:
        type: string
        default_value: "unchanged"
        description: "EKF_VEL_BODY output rate (/odom twist)."
        validation:
          one_of<>: [["unchanged", "disabled", "main_loop", "div_2", "div_4", "div_5", "div_8", "div_10", "div_20", "div_40", "div_100", "div_200", "new_data", "pps"]]
      mag:
        type: string
        default_value: "unchanged"
        description: "MAG output rate (/imu/mag)."
        validation:
          one_of<>: [["unchanged", "disabled", "main_loop", "div_2", "div_4", "div_5", "div_8", "div_10", "div_20", "div_40", "div_100", "div_200", "new_data", "pps"]]
      gps_pos:
        type: string
        default_value: "unchanged"
        description: "GPS1_POS output rate (/gps/fix, /nmea)."
        validation:
          one_of<>: [["unchanged", "disabled", "main_loop", "div_2", "div_4", "div_5", "div_8", "div_10", "div_20", "div_40", "div_100", "div_200", "new_data", "pps"]]
      gps_vel:
        type: string
        default_value: "unchanged"
        description: "GPS1_VEL output rate (GNSS velocity aiding)."
        validation:
          one_of<>: [["unchanged", "disabled", "main_loop", "div_2", "div_4", "div_5", "div_8", "div_10", "div_20", "div_40", "div_100", "div_200", "new_data", "pps"]]
      utc:
        type: string
        default_value: "unchanged"
        description: "UTC_TIME output rate (/time_reference)."
        validation:
          one_of<>: [["unchanged", "disabled", "main_loop", "div_2", "div_4", "div_5", "div_8", "div_10", "div_20", "div_40", "div_100", "div_200", "new_data", "pps"]]
      status:
        type: string
        default_value: "unchanged"
        description: "STATUS output rate (/sbg/status, /diagnostics)."
        validation:
          one_of<>: [["unchanged", "disabled", "main_loop", "div_2", "div_4", "div_5", "div_8", "div_10", "div_20", "div_40", "div_100", "div_200", "new_data", "pps"]]
