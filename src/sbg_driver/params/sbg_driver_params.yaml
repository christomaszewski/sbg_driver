sbg_driver:
  transport:
    # The device is opened once in on_activate, so transport settings cannot
    # take effect mid-run. Marked read_only: set-at-launch-only (a runtime set
    # is rejected rather than silently no-op'ing).
    type:
      type: string
      default_value: "file"
      description: "Transport: 'serial', 'udp', or 'file' (replay)"
      read_only: true
      validation:
        one_of<>: [["serial", "udp", "file"]]
    file:
      path:
        type: string
        default_value: ""
        description: "Path to .bin replay file (used when transport.type=file)"
        read_only: true
      real_time_pace:
        type: bool
        default_value: true
        description: "Pace replay to original recording rate"
        read_only: true
    serial:
      port:
        type: string
        default_value: "/dev/ttyUSB0"
        description: "Serial device path (Linux) or COM name (Windows)"
        read_only: true
      baud:
        type: int
        default_value: 921600
        description: "Serial baud rate"
        read_only: true
        validation:
          one_of<>: [[9600, 19200, 38400, 57600, 115200, 230400, 460800, 921600]]
    udp:
      remote_ip:
        type: string
        default_value: "192.168.1.20"
        description: "Remote device IP address"
        read_only: true
      in_port:
        type: int
        default_value: 1234
        description: "Local UDP listen port"
        read_only: true
        validation:
          bounds<>: [1, 65535]
      out_port:
        type: int
        default_value: 5678
        description: "Remote UDP port"
        read_only: true
        validation:
          bounds<>: [1, 65535]

  frames:
    imu:
      type: string
      default_value: "imu_link"
      description: "TF frame ID for IMU + magnetometer + barometer outputs"
    gps:
      type: string
      default_value: "gps_link"
      description: "TF frame ID for GNSS outputs (NavSatFix, gps velocity, etc.)"
    time_reference:
      type: string
      default_value: ""
      description: "frame_id for sensor_msgs/TimeReference (empty = global time)"
    base:
      type: string
      default_value: "base_link"
      description: "TF frame ID of the vehicle base"
    odom:
      type: string
      default_value: "odom"
      description: "TF frame ID of the odom frame"

  imu:
    source:
      type: string
      default_value: "auto"
      description: >-
        Which SBG IMU log feeds /imu/data, /imu/temperature and the /odom
        angular twist. 'imu_short' (SBG_ECOM_LOG_IMU_SHORT, log 44) is the
        IMU's own asynchronous sample stream at the IMU rate - the log SBG
        recommends. 'imu_data' (SBG_ECOM_LOG_IMU_DATA, log 3, deprecated by
        sbgECom 5.x) is synchronous to the EKF loop and, on every product
        except ELLIPSE, extrapolated to it, which adds noise. 'auto' (default)
        uses IMU_SHORT as soon as the device streams it and IMU_DATA until
        then, so enabling IMU_SHORT on the device switches the source with no
        driver change; the other log is then ignored so /imu/data never
        carries both. With IMU_SHORT the IMU rate usually exceeds the EKF
        rate; each sample carries the nearest EKF orientation within
        outputs.epoch_tolerance_us (orientation unknown if none qualifies).
      validation:
        one_of<>: [["auto", "imu_data", "imu_short"]]
    sensor_model:
      type: string
      default_value: "custom"
      description: >-
        Sensor tier used to look up approximate accel/gyro noise defaults for
        the /imu/data covariance. 'custom' uses the explicit *_noise_stddev
        params below (or leaves covariance unknown if those are <0). Per-model
        defaults are rough datasheet-derived starting points - refine for your
        unit.
      validation:
        one_of<>: [["custom", "ellipse", "pulse", "ekinox", "apogee", "quanta"]]
    accel_noise_stddev:
      type: double
      default_value: -1.0
      description: >-
        Per-axis accelerometer 1σ noise in m/s². Overrides the sensor_model
        default when >= 0. Covariance diagonal = stddev². <0 => unknown.
    gyro_noise_stddev:
      type: double
      default_value: -1.0
      description: >-
        Per-axis gyroscope 1σ noise in rad/s. Overrides the sensor_model
        default when >= 0. Covariance diagonal = stddev². <0 => unknown.
    mag_scale:
      type: double
      default_value: 0.0
      description: >-
        Tesla per normalized SBG magnetometer unit. The default 0 disables
        imu/mag because the sensor reports arbitrary units, while
        sensor_msgs/MagneticField requires Tesla. Set a finite positive scale
        based on the calibrated local field magnitude (e.g. approximately
        5.0e-5) to enable physical-unit output.
      validation:
        gt_eq<>: [0.0]

  raw_orientation:
    imu_tolerance_us:
      type: int
      default_value: 10000
      read_only: true
      description: >-
        Maximum device timestamp difference in microseconds when attaching
        the nearest IMU sample to GPS1_HDT on raw/orientation. 0 means exact
        matching. When an IMU stream exists, wait until it reaches the heading
        epoch or up to 20 ms for a closer sample. Without an IMU stream the
        heading publishes immediately. History is bounded to 2048 samples and
        2 seconds of receipt time. Missing matches leave accel/gyro unavailable;
        each heading epoch publishes once.
      validation:
        bounds<>: [0, 100000]
    heading_offset_deg:
      type: double
      default_value: 0.0
      read_only: true
      description: >-
        Clockwise correction added to GPS1_HDT heading to express the forward
        X axis of frames.imu. Zero assumes the reported antenna heading is
        already aligned to that axis. Applied before NED/ENU conversion.
        This is a planar heading correction, not a full mounting transform.
      validation:
        bounds<>: [-360.0, 360.0]

  time:
    utc_timeout_s:
      type: double
      default_value: 5.0
      description: "Maximum steady-clock age of a valid UTC anchor before receipt-time fallback."
      validation:
        bounds<>: [0.01, 60.0]
    source:
      type: string
      default_value: "receive_time"
      description: >-
        header.stamp source for published messages. 'receive_time' stamps with
        the host clock at dispatch (default; keeps all robot sensors in one
        timebase with zero configuration). 'device_utc' stamps each log from
        its device timeStamp mapped through the INS's UTC clock (via the
        UTC_TIME log), removing serial/scheduler jitter and giving replayed
        captures their original recording times - use it when the host and
        other sensors discipline their clocks to the INS's NTP/PTP server, so
        device UTC IS the system timebase. Requires the UTC_TIME log to be
        enabled; falls back to receive_time until the first GNSS-synced UTC
        log arrives (and for logs that carry no timestamp, e.g. raw GNSS/RTCM
        blobs). sensor_msgs/TimeReference keeps a receive-time header in both
        modes.
      validation:
        one_of<>: [["receive_time", "device_utc"]]

  convention:
    use_enu:
      type: bool
      default_value: false
      description: >-
        Convert sensor-native NED outputs to ENU per REP-103. Most ROS nav
        stacks (nav2, robot_localization) assume ENU and will produce wrong
        results with NED data. Default false (sensor-native); flip to true
        for typical ROS pipelines.

  topics:
    imu_data:
      type: string
      default_value: "imu/data"
      description: "sensor_msgs/Imu output topic"
    raw_orientation:
      type: string
      default_value: "raw/orientation"
      read_only: true
      description: "sensor_msgs/Imu: GPS1_HDT yaw with matching native IMU accel/gyro (opt-in)."
    imu_temperature:
      type: string
      default_value: "imu/temperature"
      description: "sensor_msgs/Temperature from IMU board temp"
    mag:
      type: string
      default_value: "imu/mag"
      description: "sensor_msgs/MagneticField output topic"
    nav_sat_fix:
      type: string
      default_value: "gps/fix"
      description: "sensor_msgs/NavSatFix output topic"
    gnss_heading:
      type: string
      default_value: "gps/heading"
      description: >-
        sensor_msgs/Imu output topic (orientation only) for the GNSS
        dual-antenna true heading from the primary receiver (GPS1_HDT log).
        Published only while the receiver reports a valid heading solution, so
        it stays silent on single-antenna units.
    time_reference:
      type: string
      default_value: "time_reference"
      description: "sensor_msgs/TimeReference output topic (sensor UTC clock)"
    odom:
      type: string
      default_value: "odom"
      description: "nav_msgs/Odometry output topic (composed from EKF Nav+Quat+VelBody)"
    ekf_nav_sat_fix:
      type: string
      default_value: "ekf/fix"
      description: >-
        sensor_msgs/NavSatFix output topic for the FUSED INS geodetic position
        from EkfNav. Only created when outputs.publish_ekf_nav_sat_fix is true.
        Distinct from `nav_sat_fix`, which carries the raw GNSS receiver fix.
    nmea:
      type: string
      default_value: "nmea"
      description: >-
        nmea_msgs/Sentence ($GPGGA) output topic. Only created when
        outputs.publish_nmea_gga is true. Pair with a third-party NTRIP client
        (e.g. remap to its nmea input) to upload position to a VRS caster.
    sbg_status:
      type: string
      default_value: "sbg/status"
      description: "sbg_msgs/Status output topic - device general/com/aiding bitmasks"
    sbg_ekf_status:
      type: string
      default_value: "sbg/ekf_status"
      description: "sbg_msgs/EkfStatus output topic - INS solution mode + aiding bits"
    sbg_air_data_status:
      type: string
      default_value: "sbg/air_data_status"
      description: "sbg_msgs/AirDataStatus - validity bits from the air-data sensor"
    sbg_event:
      type: string
      default_value: "sbg/event"
      description: "sbg_msgs/Event - GPIO sync-in events (A through E)"
    sbg_gps_raw:
      type: string
      default_value: "sbg/gps_raw"
      description: "sbg_msgs/GpsRaw - raw GNSS observable blob for PPP/RTK post-processing"
    sbg_mag_calib:
      type: string
      default_value: "sbg/mag_calib"
      description: "sbg_msgs/MagCalib - mag-calibration snapshot used by /sbg/*_mag_calibration"
    sbg_ship_motion:
      type: string
      default_value: "sbg/ship_motion"
      description: "sbg_msgs/ShipMotion - marine surge/sway/heave motion"
    sbg_ship_motion_hp:
      type: string
      default_value: "sbg/ship_motion_hp"
      description: "sbg_msgs/ShipMotion - delayed high-precision heave, separate from real-time motion"

  outputs:
    # ROS publication decimation only: device output and assembly remain full rate.
    # Zero is unlimited, not disabled. Positive rates use sensor time (steady time
    # for untimestamped raw GNSS), with a small allowance for timestamp jitter.
    rates_hz:
      imu_data:
        type: double
        default_value: 0.0
        read_only: true
        description: "Requested imu/data publication rate in Hz. 0 = every eligible output. Positive rates decimate using device timestamps, with a small jitter allowance."
        validation:
          gt_eq<>: [0.0]
      raw_orientation:
        type: double
        default_value: 0.0
        read_only: true
        description: "Requested raw/orientation publication rate in Hz. 0 = every eligible output. Positive rates decimate using device timestamps, with a small jitter allowance."
        validation:
          gt_eq<>: [0.0]
      imu_temperature:
        type: double
        default_value: 0.0
        read_only: true
        description: "Requested imu/temperature publication rate in Hz. 0 = every eligible output. Positive rates decimate using device timestamps, with a small jitter allowance."
        validation:
          gt_eq<>: [0.0]
      mag:
        type: double
        default_value: 0.0
        read_only: true
        description: "Requested imu/mag publication rate in Hz. 0 = every eligible output. Positive rates decimate using device timestamps, with a small jitter allowance."
        validation:
          gt_eq<>: [0.0]
      nav_sat_fix:
        type: double
        default_value: 0.0
        read_only: true
        description: "Requested gps/fix publication rate in Hz. 0 = every eligible output. Positive rates decimate using device timestamps, with a small jitter allowance."
        validation:
          gt_eq<>: [0.0]
      gnss_heading:
        type: double
        default_value: 0.0
        read_only: true
        description: "Requested gps/heading publication rate in Hz. 0 = every eligible output. Positive rates decimate using device timestamps, with a small jitter allowance."
        validation:
          gt_eq<>: [0.0]
      time_reference:
        type: double
        default_value: 0.0
        read_only: true
        description: "Requested time_reference publication rate in Hz. 0 = every eligible output. Positive rates decimate using device timestamps, with a small jitter allowance."
        validation:
          gt_eq<>: [0.0]
      odom:
        type: double
        default_value: 0.0
        read_only: true
        description: "Requested odom publication rate in Hz. 0 = every eligible output. Positive rates decimate using device timestamps, with a small jitter allowance."
        validation:
          gt_eq<>: [0.0]
      ekf_nav_sat_fix:
        type: double
        default_value: 0.0
        read_only: true
        description: "Requested ekf/fix publication rate in Hz. 0 = every eligible output. Positive rates decimate using device timestamps, with a small jitter allowance."
        validation:
          gt_eq<>: [0.0]
      nmea:
        type: double
        default_value: 1.0
        read_only: true
        description: "Requested NMEA GGA publication rate in Hz; default 1.0. 0 = every eligible GNSS fix. Requires outputs.publish_nmea_gga."
        validation:
          gt_eq<>: [0.0]
      sbg_status:
        type: double
        default_value: 0.0
        read_only: true
        description: "Requested sbg/status publication rate in Hz. 0 = every eligible output. Positive rates decimate using device timestamps, with a small jitter allowance."
        validation:
          gt_eq<>: [0.0]
      sbg_ekf_status:
        type: double
        default_value: 0.0
        read_only: true
        description: "Requested sbg/ekf_status publication rate in Hz. 0 = every eligible output. Positive rates decimate using device timestamps, with a small jitter allowance."
        validation:
          gt_eq<>: [0.0]
      sbg_air_data_status:
        type: double
        default_value: 0.0
        read_only: true
        description: "Requested sbg/air_data_status publication rate in Hz. 0 = every eligible output. Positive rates decimate using device timestamps, with a small jitter allowance."
        validation:
          gt_eq<>: [0.0]
      sbg_event:
        type: double
        default_value: 0.0
        read_only: true
        description: "Requested sbg/event publication rate in Hz. 0 = every event. A positive rate discards GPIO events across the shared A-E topic."
        validation:
          gt_eq<>: [0.0]
      sbg_gps_raw:
        type: double
        default_value: 0.0
        read_only: true
        description: "Requested sbg/gps_raw publication rate in Hz using steady receipt time. 0 = every raw packet. A positive rate discards raw data and may make post-processing impossible."
        validation:
          gt_eq<>: [0.0]
      sbg_mag_calib:
        type: double
        default_value: 0.0
        read_only: true
        description: "Requested sbg/mag_calib publication rate in Hz. 0 = every eligible output. Positive rates decimate using device timestamps, with a small jitter allowance."
        validation:
          gt_eq<>: [0.0]
      sbg_ship_motion:
        type: double
        default_value: 0.0
        read_only: true
        description: "Requested sbg/ship_motion publication rate in Hz. 0 = every eligible output. Positive rates decimate using device timestamps, with a small jitter allowance."
        validation:
          gt_eq<>: [0.0]
      sbg_ship_motion_hp:
        type: double
        default_value: 0.0
        read_only: true
        description: "Requested sbg/ship_motion_hp publication rate in Hz. 0 = every eligible output. Positive rates decimate using device timestamps, with a small jitter allowance."
        validation:
          gt_eq<>: [0.0]
      tf:
        type: double
        default_value: 0.0
        read_only: true
        description: "Requested odom-to-base TF publication rate in Hz, independent of the odom topic cap. 0 = every eligible transform. Requires tf.broadcast_odom_to_base."
        validation:
          gt_eq<>: [0.0]
    publish_raw_orientation:
      type: bool
      default_value: false
      read_only: true
      description: >-
        Publish sensor_msgs/Imu on topics.raw_orientation using primary GNSS
        true heading and timestamp-matched IMU measurements. Requires GPS1_HDT
        output from the device. Roll/pitch are unmeasured, with large variance;
        heading status/accuracy and IMU health determine field availability.
        Follows imu.source, frames.imu, convention.use_enu and time.source.
    publish_ekf_nav_sat_fix:
      type: bool
      default_value: false
      description: >-
        Publish a second sensor_msgs/NavSatFix (topic topics.ekf_nav_sat_fix,
        default ekf/fix) carrying the FUSED INS geodetic position from EkfNav.
        Off by default: /gps/fix already carries the raw GNSS fix and /odom the
        fused solution in a local Cartesian frame. Enable when a consumer needs
        the fused GLOBAL lat/lon - smoother than raw GNSS and available through
        brief GNSS dropouts via dead-reckoning. NavSatStatus borrows the fix
        grade of the latest primary-receiver GNSS fix (RTK/PPP/DGPS → GBAS,
        SBAS → SBAS, single → FIX) while the EKF reports GPS1 position aiding;
        while dead-reckoning (or before any GPS1_POS log) it is the coarse
        STATUS_FIX, and STATUS_NO_FIX while the EKF position is not valid.
    publish_nmea_gga:
      type: bool
      default_value: false
      description: >-
        Publish NMEA GGA (nmea_msgs/Sentence on topics.nmea, default nmea) at
        the rate selected by outputs.rates_hz.nmea (default 1 Hz) from the
        GNSS position. Off by default. Enable to pair with a
        third-party NTRIP client that needs the rover position (GGA) to request
        corrections from a VRS / network-RTK caster. Only emitted for a computed
        fix; UTC time-of-day is receive-time (sufficient for VRS).
    gnss_heading_offset_deg:
      type: double
      default_value: 0.0
      description: >-
        Degrees added to the GNSS dual-antenna heading before it is published
        on topics.gnss_heading (clockwise positive, like the heading itself).
        The receiver measures the direction of the primary-to-secondary antenna
        baseline; set this to the yaw from that baseline to the vehicle X axis
        when the antennas are not mounted fore-aft with the secondary ahead
        (e.g. 90 for a secondary antenna on the left, -90 on the right, 180
        behind). 0 publishes the baseline direction unchanged.
      validation:
        bounds<>: [-360.0, 360.0]
    epoch_tolerance_us:
      type: int
      default_value: -1
      description: >-
        Max device-timeStamp difference (µs) allowed when pairing IMU with
        EKF orientation and composing odometry. IMU and odometry assembly
        buffer independent records for up to 20 ms to choose the nearest
        available samples, including asynchronous streams. Exact matches
        or stream progress can complete the pairing sooner.
        0 = exact same-tick matching, the ELLIPSE contract. -1 (default) =
        auto-resolve at activation from the identified device: 0 on ELLIPSE,
        10000 on High Performance INS (their IMU clock is asynchronous to the
        INS main loop, so device timestamps never match exactly), 0 when the
        device could not be identified (file replay, data-only interfaces) —
        set an explicit value there. When setting manually, use at least the
        emission period of the fastest composed log (e.g. 10000 for a 100 Hz
        EkfQuat).
      validation:
        bounds<>: [-1, 1000000]

  # TF policy. Only odom->base is implemented: map->odom belongs to a
  # localization node (robot_localization/nav2), and base->imu mount geometry
  # belongs in the URDF. Params for those were declared-but-dead and have been
  # removed until something real consumes them.
  tf:
    broadcast_odom_to_base:
      type: bool
      default_value: false
      description: >-
        Broadcast TF: frames.odom -> frames.base from the assembled odometry
        pose. outputs.rates_hz.tf controls its publication rate independently
        of outputs.rates_hz.odom. Disable if a downstream node (e.g.
        robot_localization) provides the transform.

  configure_device:
    enable:
      type: bool
      default_value: false
      description: >-
        Master switch. When true, apply the configure_device.* settings to the
        device during on_activate (after open, before streaming). Each section
        below has its own `apply` flag, so you set only what you intend. Settings
        are written to device RAM and take effect immediately for this session;
        they are NOT persisted to non-volatile memory here. To persist, call the
        /sbg/save_settings service afterwards (that reboots the device).
    motion_profile:
      apply:
        type: bool
        default_value: false
        description: "Apply motion_profile.value when configure_device.enable is true."
      value:
        type: string
        default_value: "general_purpose"
        description: "EKF motion-dynamics model for the platform."
        validation:
          one_of<>: [["general_purpose", "automotive", "marine", "airplane", "helicopter", "pedestrian", "uav_rotary_wing", "heavy_machinery", "static", "truck", "railway", "off_road_vehicle", "underwater"]]
    aiding:
      apply:
        type: bool
        default_value: false
        description: "Apply the aiding-input port assignments below."
      gps1_port:
        type: string
        default_value: "internal"
        description: "Port the primary GNSS module is connected on."
        validation:
          one_of<>: [["port_a", "port_b", "port_c", "port_d", "port_e", "internal", "disabled"]]
      rtcm_port:
        type: string
        default_value: "disabled"
        description: "Port RTCM corrections arrive on (serial-fed DGPS/RTK)."
        validation:
          one_of<>: [["port_a", "port_b", "port_c", "port_d", "port_e", "internal", "disabled"]]
      dvl_port:
        type: string
        default_value: "disabled"
        description: "Port a DVL is connected on."
        validation:
          one_of<>: [["port_a", "port_b", "port_c", "port_d", "port_e", "internal", "disabled"]]
      air_data_port:
        type: string
        default_value: "disabled"
        description: "Port air-data aiding is connected on."
        validation:
          one_of<>: [["port_a", "port_b", "port_c", "port_d", "port_e", "internal", "disabled"]]
    imu_alignment:
      apply:
        type: bool
        default_value: false
        description: "Apply the IMU axis alignment + lever arm below."
      axis_x:
        type: string
        default_value: "forward"
        description: "Vehicle direction the IMU X axis points along."
        validation:
          one_of<>: [["forward", "backward", "left", "right", "up", "down"]]
      axis_y:
        type: string
        default_value: "right"
        description: "Vehicle direction the IMU Y axis points along."
        validation:
          one_of<>: [["forward", "backward", "left", "right", "up", "down"]]
      mis_roll_deg:
        type: double
        default_value: 0.0
        description: "Fine roll misalignment, degrees (converted to rad on apply)."
      mis_pitch_deg:
        type: double
        default_value: 0.0
        description: "Fine pitch misalignment, degrees."
      mis_yaw_deg:
        type: double
        default_value: 0.0
        description: "Fine yaw misalignment, degrees."
      lever_arm:
        type: double_array
        default_value: [0.0, 0.0, 0.0]
        description: "IMU-to-vehicle-reference lever arm [x, y, z], metres (IMU axes)."
        validation:
          fixed_size<>: [3]
    gnss:
      apply:
        type: bool
        default_value: false
        description: "Apply the GNSS antenna lever arms + dual-antenna mode."
      lever_arm_primary:
        type: double_array
        default_value: [0.0, 0.0, 0.0]
        description: "Primary GNSS antenna lever arm [x, y, z], metres (IMU axes)."
        validation:
          fixed_size<>: [3]
      lever_arm_secondary:
        type: double_array
        default_value: [0.0, 0.0, 0.0]
        description: "Secondary (dual) GNSS antenna lever arm [x, y, z], metres."
        validation:
          fixed_size<>: [3]
      secondary_mode:
        type: string
        default_value: "single"
        description: "Dual-antenna mode. 'single' means no secondary antenna."
        validation:
          one_of<>: [["single", "dual_auto", "dual_rough", "dual_precise"]]
    mag_model:
      apply:
        type: bool
        default_value: false
        description: "Apply mag_model.value."
      value:
        type: string
        default_value: "internal_normal"
        description: "Magnetometer model."
        validation:
          one_of<>: [["internal_normal", "external_ecom"]]
    output:
      apply:
        type: bool
        default_value: false
        description: "Apply the per-log device-side output rates below."
      port:
        type: string
        default_value: "main"
        description: "Device output port these rates apply to (usually the main link)."
        validation:
          one_of<>: [["main", "port_c", "port_e"]]
      imu:
        type: string
        default_value: "unchanged"
        description: >-
          IMU_DATA output rate. 'unchanged' leaves the device's current setting;
          'disabled' turns it off; div_N divides the 200 Hz loop (div_8=25 Hz).
        validation:
          one_of<>: [["unchanged", "disabled", "main_loop", "div_2", "div_4", "div_5", "div_8", "div_10", "div_20", "div_40", "div_100", "div_200", "new_data", "pps"]]
      ekf_quat:
        type: string
        default_value: "unchanged"
        description: "EKF_QUAT output rate (orientation for /imu/data + /odom)."
        validation:
          one_of<>: [["unchanged", "disabled", "main_loop", "div_2", "div_4", "div_5", "div_8", "div_10", "div_20", "div_40", "div_100", "div_200", "new_data", "pps"]]
      ekf_nav:
