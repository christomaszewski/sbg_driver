# Example params file for file-replay mode.
#
#   ros2 run sbg_driver sbg_driver_node \
#     --ros-args --params-file install/sbg_driver/share/sbg_driver/config/replay.example.yaml
#
# Or with the launch file:
#   ros2 launch sbg_driver replay.launch.py bag:=/path/to/sample.bin
sbg_driver:
  ros__parameters:
    transport:
      type: file
      file:
        path: ""               # absolute path to your .bin capture
        real_time_pace: true
    frames:
      imu: imu_link
      base: base_link
      odom: odom
    convention:
      use_enu: false           # flip to true for nav2 / robot_localization
    time:
      source: receive_time     # 'device_utc' stamps replayed logs with their ORIGINAL
                               # recording times (needs UTC_TIME logs in the capture) —
                               # ideal for offline analysis; keep receive_time if consumers
                               # reject old stamps (TF without sim time)
    topics:
      imu_data: imu/data
    # Fleet health on /diagnostics (doc/health.md). Shown at the defaults.
    health:
      vehicle_id: ""           # fleet vehicle; empty = the VEHICLE_ID environment variable
      instance: ""             # deployment name; empty = the node namespace (or name)
      publish_interval_s: 1.0  # heartbeat period
      stale_after_s: 5.0       # validity of a device observation (>= 2 x the heartbeat)
      stream_timeout_s: 2.0    # silence on the log stream, while active, that is an ERROR
      required_gnss_fix: fix   # none | fix | rtk_float | rtk_fixed
      ignored_alerts: []       # e.g. [DATALOGGER] on a product without one
      # limits:                # none by default; degrees Celsius
      #   temp_imu_c:
      #     warn_above: 70.0
      #     error_above: 85.0
