# Example params file for serial connection to a real SBG device.
sbg_driver:
  ros__parameters:
    transport:
      type: serial
      serial:
        port: /dev/ttyUSB0     # or /dev/sbg_imu with the included udev rules
        baud: 921600
    frames:
      imu: imu_link
      base: base_link
      odom: odom
    convention:
      use_enu: true            # most ROS users want ENU (REP-103)
    time:
      source: receive_time     # 'device_utc' stamps from INS UTC (jitter-free) — use when
                               # the host syncs its clock to the SBG's NTP/PTP server;
                               # requires the UTC_TIME log to be enabled
    topics:
      imu_data: imu/data
    # Fleet health on /diagnostics (doc/health.md). Shown at the defaults.
    health:
      vehicle_id: ""           # fleet vehicle; empty = the VEHICLE_ID environment variable
      instance: ""             # deployment name; empty = the node namespace (or name)
      publish_interval_s: 1.0  # heartbeat period
      stale_after_s: 5.0       # validity of a device observation (>= 2 x the heartbeat)
      stream_timeout_s: 2.0    # silence on the log stream, while active, that is an ERROR
      required_gnss_fix: fix   # none | fix | rtk_float | rtk_fixed
      ignored_alerts: []       # e.g. [DATALOGGER] on a product without one
      # limits:                # none by default; degrees Celsius
      #   temp_imu_c:
      #     warn_above: 70.0
      #     error_above: 85.0
    # Optional GPS1_HDT yaw + matching native IMU data. Enable GPS1_HDT on
    # the device too; see README for antenna alignment and matching policy.
    # outputs:
    #   publish_raw_orientation: true
    # raw_orientation:
    #   imu_tolerance_us: 10000
    #   heading_offset_deg: 0.0
