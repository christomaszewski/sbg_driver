#
# Based on ROS ament_uncrustify's Apache-2.0 ament_code_style_0_78.cfg.
# Keep the ROS structural/spacing checks, with explicit project overrides so
# clang-format 21 and uncrustify 0.78 agree on this C++23 source tree.
# .clang-format owns line wrapping and alignment; both tools check indentation.
# Unlike the ROS default: spaces after template, leading ternary operators,
# inline short constructors, outer-scope lambda bodies, and aligned initializers.
# Preserve intentional comma padding and spaces inside short function bodies;
# clang-format checks their exact layout. No source files are excluded.

# Spacing
sp_arith = force
sp_arith_additive = force
sp_assign = force
sp_enum_brace = ignore
sp_pp_concat = force
sp_pp_stringify = remove
sp_bool = force
sp_compare = force
sp_paren_brace = force
sp_before_ptr_star = force
sp_between_ptr_star = remove
sp_after_ptr_star_func = force
sp_before_ptr_star_func = force
sp_before_byref = force
sp_after_byref = force
sp_after_byref_func = force
sp_before_byref_func = force
sp_after_type = ignore
sp_before_angle = remove
sp_inside_angle = remove
sp_after_angle = remove
sp_angle_paren = remove
sp_angle_paren_empty = remove
sp_angle_word = force
sp_angle_shift = remove
sp_permit_cpp11_shift = true
sp_inside_sparen = remove
sp_sparen_brace = force
sp_after_semi = ignore
sp_after_semi_for_empty = remove
sp_before_square = remove
sp_before_vardef_square = ignore
sp_before_squares = remove
sp_inside_square = remove
sp_after_comma = add
sp_after_class_colon = force
sp_before_class_colon = force
sp_after_constr_colon = ignore
sp_before_constr_colon = ignore
sp_after_operator = remove
sp_after_operator_sym = remove
sp_after_operator_sym_empty = remove
sp_inside_paren_cast = remove
sp_cpp_cast_paren = remove
sp_sizeof_paren = remove
sp_inside_braces = ignore
sp_inside_braces_empty = remove
sp_func_proto_paren = remove
sp_func_proto_paren_empty = remove
sp_func_def_paren = remove
sp_func_def_paren_empty = remove
sp_inside_fparens = remove
sp_inside_fparen = remove
sp_square_fparen = remove
sp_fparen_brace = force
sp_fparen_brace_initializer = force
sp_func_class_paren = remove
sp_func_class_paren_empty = remove
sp_return = ignore
sp_else_brace = force
sp_brace_else = force
sp_brace_typedef = force
sp_catch_brace = force
sp_brace_catch = force
sp_finally_brace = force
sp_brace_finally = force
sp_try_brace = force
sp_before_dc = remove
sp_after_dc = remove
sp_before_nl_cont = force
sp_cond_colon = force
sp_cond_question = force
sp_case_label = force
sp_after_new = force
sp_num_before_tr_cmt = 2
sp_before_emb_cmt = ignore
sp_after_emb_cmt = ignore
sp_template_angle = force
sp_inside_braces_struct = remove
sp_inside_braces_enum = remove
sp_inside_type_brace_init_lst = remove

# Indentation
indent_columns = 2
indent_continue = 0
indent_with_tabs = 0
indent_class = true
indent_constr_colon = true
indent_ctor_init = -2
indent_shift = -1
indent_macro_brace = false
indent_switch_case = 2
indent_case_brace = 2
indent_case_comment = false
indent_comment = false
indent_paren_close = 2
indent_comma_brace = -1
indent_comma_paren = -1
indent_bool_paren = -1
indent_token_after_brace = true
indent_cpp_lambda_body = false
indent_cpp_lambda_only_once = true
indent_ternary_operator = 2
indent_member = 2
indent_ignore_arith = true
indent_var_def_cont = true
indent_ignore_first_continue = false
indent_paren_open_brace = true
indent_inside_ternary_operator = false

# Newlines
nl_assign_leave_one_liners = true
nl_class_leave_one_liners = true
nl_enum_leave_one_liners = true
nl_getset_leave_one_liners = true
nl_func_leave_one_liners = true
nl_cpp_lambda_leave_one_liners = true
nl_if_leave_one_liners = true
nl_while_leave_one_liners = true
nl_start_of_file = remove
nl_end_of_file = force
nl_end_of_file_min = 1
nl_enum_brace = force
nl_enum_class = remove
nl_enum_class_identifier = remove
nl_enum_identifier_colon = remove
nl_enum_colon_type = remove
nl_struct_brace = force
nl_union_brace = remove
nl_if_brace = remove
nl_brace_else = remove
nl_else_brace = remove
nl_else_if = remove
nl_before_if_closing_paren = remove
nl_brace_finally = remove
nl_finally_brace = remove
nl_try_brace = remove
nl_for_brace = remove
nl_catch_brace = remove
nl_brace_catch = remove
nl_while_brace = remove
nl_do_brace = remove
nl_brace_while = remove
nl_switch_brace = remove
nl_synchronized_brace = remove
nl_multi_line_cond = false
nl_namespace_brace = force
nl_template_class = force
nl_func_class_scope = remove
nl_func_scope_name = remove
nl_func_paren = remove
nl_func_paren_empty = remove
nl_func_def_paren = remove
nl_func_def_paren_empty = remove
nl_func_call_paren = remove
nl_func_call_paren_empty = remove
nl_func_decl_start_multi_line = true
nl_func_def_start_multi_line = true
nl_fdef_brace = force
nl_after_vbrace_close = true
nl_constr_colon = ignore
nl_max = 3
nl_before_access_spec = 2
nl_after_access_spec = 1

# Operator positions
pos_arith = trail
pos_assign = trail
pos_bool = trail
pos_compare = trail
pos_conditional = lead
pos_comma = trail
pos_class_comma = trail
pos_constr_comma = trail
pos_class_colon = lead_force
pos_constr_colon = ignore

# Other formatting rules
code_width = 100
cmt_indent_multi = false
mod_full_brace_do = force
mod_full_brace_for = force
mod_full_brace_function = force
mod_full_brace_if = force
mod_full_brace_while = force
mod_full_brace_using = force
mod_paren_on_return = remove
mod_pawn_semicolon = true
mod_remove_extra_semicolon = true
mod_remove_empty_return = true
pp_indent_count = 2
pp_multiline_define_body_indent = 2
use_indent_func_call_param = false
debug_sort_the_tracks = false
